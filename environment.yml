name: energy-optimal-rag
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - pip
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - statsmodels
  - pyarrow
  - matplotlib
  - requests
  - pytest
  - ruff
  # The HF replication reader (squad_qwen15b) is not part of this base
  # environment. Install it separately with:
  #   python -m pip install -e ".[hf]"
  - pip:
      - rank-bm25
      - nvidia-ml-py
      - -e .
