# Boundary probe: is k*=32 a real boundary or a grid artifact? 200 questions is
# enough to locate the energy curve; this probe is diagnostic, not confirmatory
# for accuracy.
schema_version = 1
kind = "grid"
grid_id = "boundary_k3"
k_grid = [32, 48, 64]
n_questions = 200
base_run = "boundary_qwen4b_p2"
phase = "P2"

# The probe must be able to retrieve all 64 passages, so the k=64 endpoint is
# limited by the reader and not by the retriever. The base run retrieves top-32,
# so this grid overrides the retrieval depth.
[retrieval]
top_k = 64

# 70-word passages x 64 is about 4.5k words (roughly 6k tokens). A 4096 context
# would silently truncate the k=64 endpoint, so the boundary probe uses 8192.
[reader]
num_ctx = 8192

[analysis]
primary_depth = 32
reference_depth = 64
primary_margin_pp = 5.0
secondary_margin_pp = 2.0
min_energy_savings_pct = 20.0

[notes]
purpose = "Extend the grid once, as pre-specified by gate K2, to resolve the boundary."
