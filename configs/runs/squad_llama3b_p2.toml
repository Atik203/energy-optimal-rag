# Exploratory third reader: Llama 3.2 3B Instruct Q4.
# Same 500 SQuAD IDs as squad_qwen15b_p2; not part of H7 or G5.
schema_version = 1
kind = "run"
run_id = "squad_llama3b_p2"
dataset = "squad"
dataset_version = "v1.1"
split = "dev"
n_questions = 500
k_grid = [0, 1, 2, 4, 8, 16, 32]
seed = 20261115
phase = "P2"

[reader]
backend = "ollama"
model = "llama3.2:3b"
quantization = "Q4_K_M"
num_ctx = 4096
num_predict = 24
temperature = 0.0
top_k = 1
seed = 42
think = false

[retrieval]
backend = "bm25"
top_k = 32
chunking = "word"
passage_words = 70
tokenizer = "lowercase_alnum"

[energy]
sampler = "nvml"
sample_interval_ms = 100
idle_baseline_s = 60
block_size = 20
warmup_queries = 20
nonce_hex_chars = 10
cpu_retrieval_proxy_watts = 20.0

[scoring]
primary = "normalized_em"
secondary = ["lenient_span", "token_f1_ge_0.5"]

[output]
dir = "runs"
raw_csv = "raw.csv"
blocks_json = "blocks.json"

[notes]
purpose = "Exploratory reader-family robustness; same 500 IDs as the 1.5B replication."
claim_status = "exploratory"
