# Primary powered SQuAD run: 1,000 questions x 7 depths.
schema_version = 1
kind = "run"
run_id = "squad_qwen4b_p1"
dataset = "squad"
dataset_version = "v1.1"
split = "dev"
n_questions = 1000
k_grid = [0, 1, 2, 4, 8, 16, 32]
seed = 20261115
phase = "P1"
grid_id = "primary_k7"

[reader]
backend = "ollama"
model = "qwen3.5:4b"
quantization = "Q4"
num_ctx = 4096
num_predict = 24
temperature = 0.0
top_k = 1
seed = 42
think = false

[retrieval]
backend = "bm25"
top_k = 32
chunking = "word"
passage_words = 70
tokenizer = "lowercase_alnum"

[energy]
sampler = "nvml"
sample_interval_ms = 100
idle_baseline_s = 60
