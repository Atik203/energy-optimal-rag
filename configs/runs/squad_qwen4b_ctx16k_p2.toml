# Context-budget probe: 16k allocation, not a 16k-token prompt.
# At 70 words/passage, k=64 is roughly 6k tokens; this checks the budget and
# truncation behavior against the 4k control. Diagnostic only.
# Qwen3.5-4B is used because quantized Llama 3.2 lightweight models cap at 8k.
schema_version = 1
kind = "run"
run_id = "squad_qwen4b_ctx16k_p2"
dataset = "squad"
dataset_version = "v1.1"
split = "dev"
n_questions = 200
k_grid = [32, 48, 64]
seed = 20261115
phase = "P2"

[reader]
backend = "ollama"
model = "qwen3.5:4b"
quantization = "Q4"
num_ctx = 16384
num_predict = 24
temperature = 0.0
top_k = 1
seed = 42
think = false

[retrieval]
backend = "bm25"
top_k = 64
chunking = "word"
passage_words = 70
tokenizer = "lowercase_alnum"

[energy]
sampler = "nvml"
sample_interval_ms = 100
idle_baseline_s = 60
block_size = 20
warmup_queries = 20
nonce_hex_chars = 10
cpu_retrieval_proxy_watts = 20.0

[scoring]
primary = "normalized_em"
secondary = ["lenient_span", "token_f1_ge_0.5"]

[output]
dir = "runs"
raw_csv = "raw.csv"
blocks_json = "blocks.json"

[notes]
purpose = "Context-budget and truncation probe; not a 16k-token prompt and not a new k*."
claim_status = "diagnostic"
